spring:
  application:
    name: pos-local-server
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5432/restaurant_pos_local}
    username: ${POS_DB_USERNAME:}
    password: ${POS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${POS_LOCAL_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

pos:
  server:
    name: pos-local-server
    version: 0.1.0-SNAPSHOT
    mode: OFFLINE_CAPABLE
  security:
    session-ttl-minutes: ${POS_SESSION_TTL_MINUTES:480}
    max-active-sessions-per-user: ${POS_MAX_ACTIVE_SESSIONS:5}
    max-failed-login-attempts: ${POS_MAX_FAILED_LOGINS:5}
    lockout-duration-minutes: ${POS_LOCKOUT_MINUTES:15}
    throttle-window-seconds: ${POS_THROTTLE_WINDOW_SECONDS:60}
    max-throttle-attempts-per-key: ${POS_THROTTLE_MAX_ATTEMPTS:10}
    approval-ttl-minutes: ${POS_APPROVAL_TTL_MINUTES:5}
